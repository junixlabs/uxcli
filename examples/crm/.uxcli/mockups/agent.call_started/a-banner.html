<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đang gọi</title><link rel="stylesheet" href="../_shared/tokens.css"><style>*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700}.brand i{width:22px;height:22px;border-radius:6px;background:var(--brand);display:inline-block}
.who{font-size:12px;color:var(--dim)}
main{padding:16px}h1{font-size:20px;margin:0 0 4px}.muted{color:var(--dim);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.btn{display:block;width:100%;border:0;border-radius:8px;padding:12px;font:600 15px inherit;font-family:inherit;text-align:center;text-decoration:none}
.btn.p{background:var(--brand);color:var(--surface)}.btn.s{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft)}.row:first-child{border-top:0}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.phone{font-size:24px;font-weight:700;letter-spacing:.02em}
.sticky{position:sticky;top:0;z-index:2;background:var(--surface);padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px}
input{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px 12px;font:14px inherit;font-family:inherit;margin:4px 0 12px}
label{font-size:12px;font-weight:600}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}.stat b{display:block;font-size:22px}
.stats{display:flex;gap:8px}
.col{display:inline-block;vertical-align:top;width:200px;margin-right:10px}.board{overflow-x:auto;white-space:nowrap}
.note{background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:8px;padding:10px;font-size:12px;color:var(--warn-ink)}</style></head>
<body>
<header class="top"><span class="brand"><i></i>Địa Ốc CRM</span><span class="who">Môi giới · Minh</span></header>
<div class="sticky" style="background:var(--brand-soft)"><div data-uxcli="call-status" style="flex:1;font-weight:600;color:var(--brand)">Đang gọi… 0901 234 573</div><a class="btn s" href="#" style="flex:0 0 auto;padding:8px 12px">Kết thúc</a></div>
<main><h1>Nguyễn Văn A</h1><p class="muted">Cuộc gọi bắt đầu 11:46</p>
<div class="card"><div class="k">Ghi chú cuộc gọi</div><input placeholder="Khách nói gì…"><a class="btn s" href="#">Đặt lịch hẹn</a></div>
<div class="card"><div class="k">Nhu cầu</div><div class="row"><span>Đất nền · Long Thành</span><b>1,8 – 2,2 tỷ</b></div></div></main>
</body>
</html>
