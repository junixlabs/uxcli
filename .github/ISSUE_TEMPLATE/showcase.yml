name: A real run for the Verdict Lab
description: Submit a run of uxcli on a product you own, with its packet, to be shown as evidence of what the instrument does.
title: "[showcase] <product or page>: <what the card said>"
labels: [showcase]
body:
  - type: markdown
    attributes:
      value: The Lab shows runs, not opinions. A submission is the packet and the pictures; the maintainers re-measure before it is shown.
  - type: input
    id: version
    attributes:
      label: uxcli version and command
      placeholder: "0.8.0 · uxcli run .uxcli/journeys/checkout.json --viewport=390x844"
    validations: { required: true }
  - type: textarea
    id: card
    attributes:
      label: The card as printed
      description: The whole card, not a paraphrase. The verdict blocks are what the Lab shows.
      render: text
    validations: { required: true }
  - type: textarea
    id: packet
    attributes:
      label: The run directory
      description: Attach `run.json` and the `artifacts/` images (drag them here), or link a public commit that carries them. A run without its packet cannot be shown.
    validations: { required: true }
  - type: dropdown
    id: rights
    attributes:
      label: May the screenshots be shown publicly?
      options:
        - yes, it is my product or a public page
        - no, show the card text only
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: What makes this run worth showing
      description: A commitment somebody signed and the browser refused; a state the product could not hold; a finding a person confirmed by hand.
