# The Verdict Lab is generated by scripts/lab.mjs and committed under docs/lab/; this only serves it.
name: pages
on:
  push:
    branches: [main]
    paths: ['docs/lab/**']
permissions:
  pages: write
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/lab }
      - id: deploy
        uses: actions/deploy-pages@v4
