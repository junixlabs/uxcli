<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" role="img" aria-label="The seven engines of uxcli, drawn as a cycle: context, reasoning, commitment, measurement, evidence, verdict, agent loop, and what the loop learned feeds back into context. All seven are complete." font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8898"/>
    </marker>
  </defs>

  <text x="74" y="26" font-size="13" font-weight="700" fill="#101828" letter-spacing=".06em">THE SEVEN ENGINES</text>
  <text x="260" y="26" font-size="11.5" fill="#7d8898">a UX decision system, not a pipeline with an end</text>
  <line x1="74" y1="40" x2="834" y2="40" stroke="#eceff2"/>
  <path d="M454,116 L454,122" stroke="#dfe3e8" stroke-width="1.5"/>
  <path d="M454,181 L454,187" stroke="#dfe3e8" stroke-width="1.5"/>
  <path d="M454,246 L454,252" stroke="#dfe3e8" stroke-width="1.5"/>
  <path d="M454,311 L454,317" stroke="#dfe3e8" stroke-width="1.5"/>
  <path d="M454,376 L454,382" stroke="#dfe3e8" stroke-width="1.5"/>
  <path d="M454,441 L454,447" stroke="#dfe3e8" stroke-width="1.5"/>
  <g>
    <rect x="74" y="58" width="760" height="58" rx="7" fill="#ffffff" stroke="#dfe3e8"/>
    <rect x="74" y="58" width="4" height="58" rx="2" fill="#067647"/>
    <text x="96" y="82" font-size="12" fill="#7d8898">1</text>
    <text x="120" y="82" font-size="14" font-weight="700" fill="#101828" letter-spacing=".04em">CONTEXT</text>
    <text x="120" y="101" font-size="11.5" fill="#475467">business · domain · users · journeys · constraints</text>
    <rect x="716" y="76" width="98" height="22" rx="11" fill="#dcfae6" stroke="#067647" stroke-opacity=".55"/>
    <text x="765" y="91" font-size="11" font-weight="600" fill="#067647" text-anchor="middle">cited</text>
  </g>
  <g>
    <rect x="74" y="123" width="760" height="58" rx="7" fill="#ffffff" stroke="#dfe3e8"/>
    <rect x="74" y="123" width="4" height="58" rx="2" fill="#067647"/>
    <text x="96" y="147" font-size="12" fill="#7d8898">2</text>
    <text x="120" y="147" font-size="14" font-weight="700" fill="#101828" letter-spacing=".04em">REASONING</text>
    <text x="120" y="166" font-size="11.5" fill="#475467">patterns · research · hypotheses · risks → proposals</text>
    <rect x="716" y="141" width="98" height="22" rx="11" fill="#dcfae6" stroke="#067647" stroke-opacity=".55"/>
    <text x="765" y="156" font-size="11" font-weight="600" fill="#067647" text-anchor="middle">anchored</text>
  </g>
  <g>
    <rect x="74" y="188" width="760" height="58" rx="7" fill="#ffffff" stroke="#dfe3e8"/>
    <rect x="74" y="188" width="4" height="58" rx="2" fill="#067647"/>
    <text x="96" y="212" font-size="12" fill="#7d8898">3</text>
    <text x="120" y="212" font-size="14" font-weight="700" fill="#101828" letter-spacing=".04em">COMMITMENT</text>
    <text x="120" y="231" font-size="11.5" fill="#475467">proposed · signed · owner · source · lineage</text>
    <rect x="716" y="206" width="98" height="22" rx="11" fill="#dcfae6" stroke="#067647" stroke-opacity=".55"/>
    <text x="765" y="221" font-size="11" font-weight="600" fill="#067647" text-anchor="middle">traceable</text>
  </g>
  <g>
    <rect x="74" y="253" width="760" height="58" rx="7" fill="#ffffff" stroke="#dfe3e8"/>
    <rect x="74" y="253" width="4" height="58" rx="2" fill="#067647"/>
    <text x="96" y="277" font-size="12" fill="#7d8898">4</text>
    <text x="120" y="277" font-size="14" font-weight="700" fill="#101828" letter-spacing=".04em">MEASUREMENT</text>
    <text x="120" y="296" font-size="11.5" fill="#475467">probes · methods · targets · environments</text>
    <rect x="716" y="271" width="98" height="22" rx="11" fill="#dcfae6" stroke="#067647" stroke-opacity=".55"/>
    <text x="765" y="286" font-size="11" font-weight="600" fill="#067647" text-anchor="middle">flows too</text>
  </g>
  <g>
    <rect x="74" y="318" width="760" height="58" rx="7" fill="#ffffff" stroke="#dfe3e8"/>
    <rect x="74" y="318" width="4" height="58" rx="2" fill="#067647"/>
    <text x="96" y="342" font-size="12" fill="#7d8898">5</text>
    <text x="120" y="342" font-size="14" font-weight="700" fill="#101828" letter-spacing=".04em">EVIDENCE</text>
    <text x="120" y="361" font-size="11.5" fill="#475467">artifacts · snapshots · replay · provenance</text>
    <rect x="716" y="336" width="98" height="22" rx="11" fill="#dcfae6" stroke="#067647" stroke-opacity=".55"/>
    <text x="765" y="351" font-size="11" font-weight="600" fill="#067647" text-anchor="middle">no overwrites</text>
  </g>
  <g>
    <rect x="74" y="383" width="760" height="58" rx="7" fill="#ffffff" stroke="#dfe3e8"/>
    <rect x="74" y="383" width="4" height="58" rx="2" fill="#067647"/>
    <text x="96" y="407" font-size="12" fill="#7d8898">6</text>
    <text x="120" y="407" font-size="14" font-weight="700" fill="#101828" letter-spacing=".04em">VERDICT</text>
    <text x="120" y="426" font-size="11.5" fill="#475467">seven closed verdicts · six provenance · two methods</text>
    <rect x="716" y="401" width="98" height="22" rx="11" fill="#dcfae6" stroke="#067647" stroke-opacity=".55"/>
    <text x="765" y="416" font-size="11" font-weight="600" fill="#067647" text-anchor="middle">complete</text>
  </g>
  <g>
    <rect x="74" y="448" width="760" height="58" rx="7" fill="#ffffff" stroke="#dfe3e8"/>
    <rect x="74" y="448" width="4" height="58" rx="2" fill="#067647"/>
    <text x="96" y="472" font-size="12" fill="#7d8898">7</text>
    <text x="120" y="472" font-size="14" font-weight="700" fill="#101828" letter-spacing=".04em">AGENT LOOP</text>
    <text x="120" y="491" font-size="11.5" fill="#475467">fix · propose · explain · request authority</text>
    <rect x="716" y="466" width="98" height="22" rx="11" fill="#dcfae6" stroke="#067647" stroke-opacity=".55"/>
    <text x="765" y="481" font-size="11" font-weight="600" fill="#067647" text-anchor="middle">scoped</text>
  </g>

  <!-- engine 7 feeds engine 1: what the loop learned becomes context, which is why this is a cycle -->
  <path d="M68,477 L34,477 L34,87 L68,87"
        fill="none" stroke="#7d8898" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="28" y="282" font-size="11" fill="#7d8898" text-anchor="middle"
        transform="rotate(-90 28 282)">what it learned becomes context</text>

  <g font-size="11" fill="#475467">
    <rect x="74" y="528" width="9" height="9" rx="2" fill="#067647"/>
    <text x="89" y="536">complete</text>
  </g>
</svg>
