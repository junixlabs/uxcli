<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uxcli runs</title>
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<!-- Four tiers, four files, and the order is the dependency order:
       dashboard.tokens.css       the values — colour, type, spacing, radius, measure
       dashboard.components.css   the things — one component, one definition
       dashboard.shell.css        the frame those things stand in
       dashboard.ui.js            the same things in markup, one factory each
       dashboard.app.js           the screens, composed of nothing but the above -->
<link rel="stylesheet" href="/dashboard.tokens.css">
<link rel="stylesheet" href="/dashboard.components.css">
<link rel="stylesheet" href="/dashboard.shell.css">
<!-- Before the first paint, not after: a page that renders light and then turns dark has already
     shown the reader a state they did not choose. A module script is deferred, so this one stays
     inline and stays here. -->
<script>try{var t=localStorage.getItem('uxcli.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<script type="module" src="/dashboard.app.js"></script>
</head>
<body>
<div class="app">

  <header class="top">
    <a class="top-brand" href="#/" aria-label="uxcli — home"><span class="top-mark"><!--mark--></span>uxcli</a>
    <p class="top-tag">Real pages. Real journeys. Measured.</p>
    <!-- The search box is a component; the bar only says where it goes. -->
    <div class="top-tools" id="tools">
      <button class="top-btn" id="theme" type="button" title="light / dark" aria-label="switch between light and dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"></path></svg>
      </button>
      <button class="top-btn" id="reload" type="button" title="re-read the index" aria-label="re-read the index">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.5-5.8"></path><path d="M20 4v4.5h-4.5"></path></svg>
      </button>
    </div>
  </header>

  <nav class="rail" aria-label="Sections">
    <ul class="rail-nav">
      <li><a href="#/" data-view="home" class="rail-link">
        <svg class="rail-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 10.5 12 4l8 6.5V20H4z"></path></svg>Home</a></li>
      <li><a href="#/runs" data-view="runs" class="rail-link">
        <svg class="rail-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 9h8M8 13h8M8 17h5"></path></svg>Runs</a></li>
      <li><a href="#/journeys" data-view="journeys" class="rail-link">
        <svg class="rail-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="12" r="2.5"></circle><path d="M8.5 12h7"></path></svg>Journeys</a></li>
      <li><a href="#/pages" data-view="pages" class="rail-link">
        <svg class="rail-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path></svg>Pages</a></li>
      <li><a href="#/projects" data-view="projects" class="rail-link">
        <svg class="rail-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7h6l2 2.5h10V19H3z"></path></svg>Projects</a></li>
    </ul>

    <div class="rail-foot">
      <a class="rail-link is-out" href="https://uxcli.thejunix.com/pages/docs" target="_blank" rel="noreferrer noopener">
        <svg class="rail-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3 2.4V14"></path><path d="M12 17v.01"></path></svg>Documentation</a>
      <a class="rail-link is-out" href="https://github.com/junixlabs/uxcli" target="_blank" rel="noreferrer noopener">
        <svg class="rail-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 1.8a10.2 10.2 0 0 0-3.2 19.9c.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.4-3.4-1.4-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 4.9.3.3.7 1 .7 2v2.9c0 .3.2.6.7.5A10.2 10.2 0 0 0 12 1.8z"></path></svg>GitHub</a>
      <!-- What this page can check from where it is standing, and nothing beyond it. -->
      <p class="rail-server">
        <b id="live">uxcli server</b>
        <span id="origin"></span>
        <span id="idxline"></span>
        <span id="idxwhen"></span>
      </p>
      <p class="rail-say" id="say" role="status" aria-live="polite"></p>
    </div>
  </nav>

  <main class="main" id="stage"><div class="empty">loading&hellip;</div></main>
</div>
</body>
</html>
